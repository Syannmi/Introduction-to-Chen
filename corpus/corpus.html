<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文考試語料庫入口</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --tiffany:#0ABAB5;
      --tiffanyLight:#E0F7F6;
      --tiffanyDark:#008F8A;
      --slateDark:#333333;
      --bg:#E0F7F6;
      --paper:#ffffff;
      --ink:#333333;
      --muted:#5f7f7d;
      --accent:#0ABAB5;
      --accent2:#008F8A;
      --line:#bfecea;
      --green:#008F8A;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:28px 18px;
      overflow-x:hidden;
      font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top left,rgba(255,255,255,.95) 0,rgba(224,247,246,.9) 34%,rgba(10,186,181,.28) 100%),
        linear-gradient(135deg,#ffffff 0%,#E0F7F6 45%,#b9efec 100%);
      color:var(--ink);
      position:relative;
    }

    .floating-circle{
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,.28);
      border:1px solid rgba(255,255,255,.45);
      animation:float 10s ease-in-out infinite;
      backdrop-filter:blur(4px);
      box-shadow:0 18px 42px rgba(0,143,138,.08);
      pointer-events:none;
    }

    .c1{width:250px;height:250px;top:-70px;left:-50px}
    .c2{width:190px;height:190px;bottom:-56px;right:-36px;animation-delay:2s}
    .c3{width:120px;height:120px;top:15%;right:10%;animation-delay:4s}
    .c4{width:76px;height:76px;bottom:16%;left:9%;animation-delay:1.4s}

    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-18px)}
    }

    .container{
      width:min(980px,94vw);
      background:rgba(255,255,255,.88);
      border:1px solid rgba(10,186,181,.22);
      border-radius:32px;
      padding:52px 46px 42px;
      box-shadow:
        0 18px 42px rgba(0,143,138,.13),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter:blur(10px);
      text-align:center;
      position:relative;
      z-index:2;
      overflow:hidden;
    }

    .container::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:12px;
      background:linear-gradient(135deg,#0ABAB5,#008F8A);
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:16px;
      padding:8px 15px;
      border-radius:999px;
      background:#E0F7F6;
      color:#008F8A;
      border:1px solid rgba(10,186,181,.25);
      font-size:14px;
      font-weight:800;
      letter-spacing:.05em;
      box-shadow:0 8px 18px rgba(10,186,181,.08);
    }

    .title{
      margin:0;
      font-size:clamp(32px,5vw,56px);
      font-weight:900;
      letter-spacing:.08em;
      color:#008F8A;
      text-shadow:0 2px 10px rgba(255,255,255,.65);
    }

    .subtitle{
      margin-top:16px;
      font-size:1.05rem;
      line-height:1.9;
      color:#5f7f7d;
      font-weight:500;
    }

    .divider{
      width:110px;
      height:6px;
      border-radius:999px;
      background:linear-gradient(90deg,#0ABAB5,#E0F7F6,#008F8A);
      margin:30px auto 38px;
      box-shadow:0 8px 18px rgba(10,186,181,.18);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:22px;
    }

    .card{
      position:relative;
      display:block;
      overflow:hidden;
      background:#ffffff;
      border:1px solid rgba(10,186,181,.22);
      border-radius:26px;
      padding:30px 24px 28px;
      text-decoration:none;
      color:var(--slateDark);
      transition:all .22s ease;
      box-shadow:0 8px 18px rgba(10,186,181,.08);
      isolation:isolate;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(224,247,246,.92));
      opacity:0;
      transition:opacity .22s ease;
      z-index:-1;
    }

    .card::after{
      content:"";
      position:absolute;
      width:110px;
      height:110px;
      border-radius:50%;
      right:-42px;
      top:-42px;
      background:rgba(10,186,181,.12);
      transition:all .22s ease;
      z-index:-1;
    }

    .card:hover,
    .card:focus-visible{
      transform:translateY(-6px);
      border-color:#0ABAB5;
      box-shadow:0 14px 30px rgba(10,186,181,.18);
      outline:none;
    }

    .card:hover::before,
    .card:focus-visible::before{opacity:1}
    .card:hover::after,
    .card:focus-visible::after{transform:scale(1.3);background:rgba(10,186,181,.18)}

    .emoji{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:68px;
      height:68px;
      margin-bottom:16px;
      border-radius:22px;
      background:#E0F7F6;
      color:#008F8A;
      font-size:2.6rem;
      border:1px solid rgba(10,186,181,.22);
      box-shadow:0 8px 18px rgba(10,186,181,.08);
    }

    .exam-name{
      font-size:2rem;
      font-weight:900;
      letter-spacing:.06em;
      margin-bottom:10px;
      color:#008F8A;
    }

    .desc{
      font-size:.98rem;
      color:#5f7f7d;
      line-height:1.75;
      font-weight:500;
    }

    .footer{
      margin-top:36px;
      padding-top:22px;
      border-top:1px solid rgba(10,186,181,.22);
      font-size:.9rem;
      color:#008F8A;
      line-height:1.8;
      font-weight:700;
    }

    .footer span{
      color:#5f7f7d;
      font-weight:600;
    }

    @media(max-width:720px){
      body{align-items:flex-start;padding:18px 12px}
      .container{padding:42px 22px 32px;border-radius:26px}
      .grid{grid-template-columns:1fr;gap:16px}
      .card{padding:26px 20px}
      .exam-name{font-size:1.7rem}
      .subtitle{font-size:.98rem}
      .floating-circle{opacity:.7}
    }
  </style>
</head>
<body>
  <div class="floating-circle c1"></div>
  <div class="floating-circle c2"></div>
  <div class="floating-circle c3"></div>
  <div class="floating-circle c4"></div>

  <main class="container">
    <div class="eyebrow">English Corpus</div>

    <h1 class="title">英語文入學測驗語料庫</h1>

    <div class="subtitle">
      請選擇想進入的考試語料庫。<br>
      可查詢歷屆英文詞頻、PDF 出現位置與語料片段
    </div>

    <div class="divider"></div>

    <section class="grid" aria-label="考試語料庫入口">
      <a class="card" href="會考詞頻查詢表/會考.html">
        <span class="emoji">📘</span>
        <div class="exam-name">會考</div>
        <div class="desc">
          國中教育會考英語語料庫<br>
          民國104年至115年之歷屆試題
        </div>
      </a>

      <a class="card" href="統測詞頻查詢表/統測.html">
        <span class="emoji">📗</span>
        <div class="exam-name">統測</div>
        <div class="desc">
          四技二專統一入學測驗英語文語料庫<br>
          民國90年至115年之歷屆試題
        </div>
      </a>

      <a class="card" href="學測詞頻查詢表/學測.html">
        <span class="emoji">📙</span>
        <div class="exam-name">學測</div>
        <div class="desc">
          大學入學學科能力測驗英語文語料庫<br>
          民國83年至115年之歷屆試題
        </div>
      </a>

      <a class="card" href="指考詞頻查詢表/指考.html">
        <span class="emoji">📕</span>
        <div class="exam-name">指考</div>
        <div class="desc">
          大學入學指定科目考試英語文語料庫<br>
          民國91年至110年之歷屆試題
        </div>
      </a>
    </section>

    <div class="footer">
      Organized by Chen, Xian-wei<br>
      <span>Powered by AntConc</span>
    </div>
  </main>
</body>
</html>
