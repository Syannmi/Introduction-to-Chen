<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文文法對照表｜Grammar Reference</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --tiffany:#0ABAB5;
      --tiffanyLight:#E0F7F6;
      --tiffanyDark:#008F8A;
      --slateDark:#333333;
      --paper:#ffffff;
      --ink:#333333;
      --muted:#5f7f7d;
      --line:#bfecea;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      padding:28px 18px;
      overflow-x:hidden;
      font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top left,rgba(255,255,255,.95) 0,rgba(224,247,246,.9) 34%,rgba(10,186,181,.28) 100%),
        linear-gradient(135deg,#ffffff 0%,#E0F7F6 45%,#b9efec 100%);
      color:var(--ink);
      position:relative;
    }

    .floating-circle{
      position:fixed;
      border-radius:50%;
      background:rgba(255,255,255,.28);
      border:1px solid rgba(255,255,255,.45);
      animation:float 10s ease-in-out infinite;
      backdrop-filter:blur(4px);
      box-shadow:0 18px 42px rgba(0,143,138,.08);
      pointer-events:none;
    }
    .c1{width:250px;height:250px;top:-70px;left:-50px}
    .c2{width:190px;height:190px;bottom:-56px;right:-36px;animation-delay:2s}
    .c3{width:120px;height:120px;top:15%;right:10%;animation-delay:4s}
    .c4{width:76px;height:76px;bottom:16%;left:9%;animation-delay:1.4s}

    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .container{
      width:min(1120px,94vw);
      margin:0 auto;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(10,186,181,.22);
      border-radius:32px;
      padding:48px 42px 38px;
      box-shadow:0 18px 42px rgba(0,143,138,.13), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter:blur(10px);
      text-align:center;
      position:relative;
      z-index:2;
      overflow:hidden;
    }

    .container::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:12px;
      background:linear-gradient(135deg,#0ABAB5,#008F8A);
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:28px;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 15px;
      border-radius:999px;
      color:var(--tiffanyDark);
      text-decoration:none;
      background:#E0F7F6;
      border:1px solid rgba(10,186,181,.25);
      font-size:14px;
      font-weight:800;
      transition:all .22s ease;
    }
    .back-link:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(10,186,181,.14)}

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:16px;
      padding:8px 15px;
      border-radius:999px;
      background:#E0F7F6;
      color:#008F8A;
      border:1px solid rgba(10,186,181,.25);
      font-size:14px;
      font-weight:800;
      letter-spacing:.05em;
      box-shadow:0 8px 18px rgba(10,186,181,.08);
    }

    .title{
      margin:0;
      font-size:clamp(30px,5vw,54px);
      font-weight:900;
      letter-spacing:.04em;
      color:#008F8A;
      text-shadow:0 2px 10px rgba(255,255,255,.65);
    }

    .subtitle{
      margin-top:16px;
      font-size:1.03rem;
      line-height:1.9;
      color:#5f7f7d;
      font-weight:500;
    }

    .divider{
      width:110px;
      height:6px;
      border-radius:999px;
      background:linear-gradient(90deg,#0ABAB5,#E0F7F6,#008F8A);
      margin:28px auto 32px;
      box-shadow:0 8px 18px rgba(10,186,181,.18);
    }

.search-box{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.search-box input{
  width:min(520px,100%);
  padding:14px 18px;
  border-radius:999px;
  border:1px solid rgba(10,186,181,.35);
  font:inherit;
  outline:none;
}

.search-box button{
  padding:14px 24px;
  border-radius:999px;
  background:linear-gradient(135deg,#0ABAB5,#008F8A);
  color:white;
  font-weight:900;
}

    .panel{
      background:#ffffff;
      border:1px solid rgba(10,186,181,.22);
      border-radius:28px;
      padding:28px;
      box-shadow:0 8px 18px rgba(10,186,181,.08);
      overflow:hidden;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:16px 22px;
      padding-bottom:22px;
      border-bottom:1px solid rgba(10,186,181,.18);
      margin-bottom:24px;
    }

    .control-group{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
    .label{font-weight:900;color:var(--slateDark)}

    button{
      font:inherit;
      cursor:pointer;
      border:none;
    }

    .level-btn,.book-btn{
      position:relative;
      background:#ffffff;
      color:var(--tiffanyDark);
      border:1px solid rgba(10,186,181,.28);
      border-radius:999px;
      padding:10px 22px;
      font-weight:900;
      transition:all .22s ease;
      box-shadow:0 8px 18px rgba(10,186,181,.06);
      overflow:hidden;
    }

    .book-btn{min-width:56px;padding:11px 16px;border-radius:18px}

    .level-btn:hover,.book-btn:hover{
      transform:translateY(-3px);
      border-color:var(--tiffany);
      box-shadow:0 12px 24px rgba(10,186,181,.14);
      background:linear-gradient(135deg,#ffffff,#E0F7F6);
    }

    .active-btn{
      background:linear-gradient(135deg,#0ABAB5,#008F8A)!important;
      color:white!important;
      border-color:transparent!important;
      box-shadow:0 12px 24px rgba(10,186,181,.22)!important;
    }

    .hidden{display:none!important}

    .placeholder{
      min-height:210px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      color:#5f7f7d;
      font-weight:700;
      line-height:1.8;
    }
    .placeholder-icon{font-size:48px;margin-bottom:12px;opacity:.82}

    .table-wrap{width:100%;overflow-x:auto;animation:fadeIn .35s ease-out both}
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width:760px;
      overflow:hidden;
      border-radius:20px;
      border:1px solid rgba(10,186,181,.20);
      box-shadow:0 8px 18px rgba(10,186,181,.07);
      text-align:center;
      font-size:.98rem;
    }
    th{
      padding:16px 14px;
      background:linear-gradient(135deg,#0ABAB5,#008F8A);
      color:white;
      font-weight:900;
      letter-spacing:.03em;
      border-right:1px solid rgba(255,255,255,.25);
    }
    td{
      padding:15px 14px;
      border-right:1px solid rgba(10,186,181,.12);
      border-bottom:1px solid rgba(10,186,181,.12);
      line-height:1.75;
      color:var(--slateDark);
      font-weight:500;
    }
    tr:nth-child(even) td{background:#f4fcfb}
    tr:hover td{background:#E0F7F6}
    .book-cell,.unit-cell{font-weight:900;color:var(--tiffanyDark)}
    .book-cell{background:#E0F7F6!important}

    .footer{
      margin-top:26px;
      padding-top:20px;
      border-top:1px solid rgba(10,186,181,.22);
      font-size:.9rem;
      color:#008F8A;
      line-height:1.8;
      font-weight:800;
    }
    .footer span{color:#5f7f7d;font-weight:600}

    @media(max-width:720px){
      body{padding:18px 12px}
      .container{padding:38px 20px 30px;border-radius:26px}
      .topbar{justify-content:center}
      .panel{padding:20px 14px;border-radius:24px}
      .controls{align-items:stretch}
      .control-group{width:100%}
      .level-btn{flex:1}
      .subtitle{font-size:.97rem}
      table{font-size:.9rem;min-width:680px}
    }
  </style>
</head>
<body>
  <div class="floating-circle c1"></div>
  <div class="floating-circle c2"></div>

  <main class="container">
    <div class="topbar">
      <a class="back-link" href="index.html">← 回首頁</a>
      <a class="back-link" href="corpus.html">大考語料庫 →</a>
    </div>

    <div class="eyebrow">Grammar Reference</div>
    <h1 class="title">英文文法程度對照表</h1>
    <div class="subtitle">

      可快速查看高中句型、Language in Use，以及國中三版本文法進度。
    </div>
    <div class="divider"></div>

<div class="search-box">
  <input 
  id="grammarSearch" 
  type="text" 
  placeholder="輸入關鍵字，例如：被動語態、關代、完成式"
  onkeydown="handleSearchEnter(event)"
>
  <button onclick="searchGrammar()">搜尋</button>
</div>

<div id="search-results"></div>

<section class="panel" aria-label="文法對照表查詢工具">

      <div class="controls">
        <div class="control-group">
          <span class="label">學制選擇：</span>
          <button onclick="selectLevel('high')" id="btn-high" class="level-btn">高中</button>
          <button onclick="selectLevel('junior')" id="btn-junior" class="level-btn">國中</button>
        </div>
        <div id="book-container" class="control-group hidden">
          <span class="label">冊數：</span>
          <div id="book-buttons" class="control-group"></div>
        </div>
      </div>

      <div id="table-container" class="placeholder">
        <div class="placeholder-icon">📚</div>
        請先選擇學制，再選擇冊數以開啟對照表
      </div>
    </section>

    <div class="footer">
      Organized by Chen, Xian-wei<br>
      <span>Grammar Reference by Proficiency Level</span>
    </div>
  </main>

    function selectLevel(level) {
      const container = document.getElementById('book-container');
      const buttonBox = document.getElementById('book-buttons');
      const tableBox = document.getElementById('table-container');

      buttonBox.innerHTML = '';
      tableBox.className = 'placeholder';
      tableBox.innerHTML = '<div class="placeholder-icon">✨</div>請選擇冊數...';
      container.classList.remove('hidden');

      document.getElementById('btn-high').classList.toggle('active-btn', level === 'high');
      document.getElementById('btn-junior').classList.toggle('active-btn', level === 'junior');

      const count = level === 'high' ? 5 : 6;
      for (let i = 1; i <= count; i++) {
        const btn = document.createElement('button');
        btn.innerText = `B${i}`;
        btn.className = 'book-btn';
        btn.id = `btn-book-${i}`;
        btn.onclick = () => showTable(level, i);
        buttonBox.appendChild(btn);
      }
    }

    function showTable(level, bookNum) {
      const tableBox = document.getElementById('table-container');
      const data = grammarDB[level][bookNum];

      document.querySelectorAll('#book-buttons button').forEach(btn => btn.classList.remove('active-btn'));
      document.getElementById(`btn-book-${bookNum}`).classList.add('active-btn');

      let html = '<div class="table-wrap"><table>';
      if (level === 'high') {
        html += `<thead><tr>
          <th>Book</th><th>Unit</th><th>Sentence Pattern</th><th>Language in Use</th>
        </tr></thead><tbody>`;
        data.forEach((item, index) => {
          html += `<tr>
            ${index === 0 ? `<td rowspan="${data.length}" class="book-cell">B${bookNum}</td>` : ''}
            <td class="unit-cell">${item.unit}</td>
            <td>${item.p}</td>
            <td>${item.l}</td>
          </tr>`;
        });
      } else {
        html += `<thead><tr>
          <th>Book</th><th>Unit</th><th>南一</th><th>翰林</th><th>康軒</th>
        </tr></thead><tbody>`;
        data.forEach((item, index) => {
          html += `<tr>
            ${index === 0 ? `<td rowspan="${data.length}" class="book-cell">B${bookNum}</td>` : ''}
            <td class="unit-cell">${item.unit}</td>
            <td>${item.nani}</td>
            <td>${item.hanlin}</td>
            <td>${item.kang}</td>
          </tr>`;
        });
      }
      html += '</tbody></table></div>';
      tableBox.className = '';
      tableBox.innerHTML = html;
    }

function cleanText(text){
  return String(text || "").replace(/<br>/g, " ");
}

function searchGrammar(){
  const keyword = document.getElementById("grammarSearch").value.trim().toLowerCase();
  const resultBox = document.getElementById("search-results");

  if(!keyword){
    resultBox.innerHTML = "";
    return;
  }

  let results = [];

  Object.keys(grammarDB).forEach(level => {
    Object.keys(grammarDB[level]).forEach(book => {
      grammarDB[level][book].forEach(item => {
        Object.keys(item).forEach(key => {
          if(key === "unit") return;

          const text = cleanText(item[key]);

          if(text.toLowerCase().includes(keyword)){
let versionName = "";

if(level === "high"){
  versionName = "龍騰";
}else{
  if(key === "nani") versionName = "南一";
  if(key === "hanlin") versionName = "翰林";
  if(key === "kang") versionName = "康軒";
}

results.push({
  level: level === "high" ? "高中" : "國中",
  book: `B${book}`,
  unit: item.unit,
  version: versionName,
  grammar: text
});
          }
        });
      });
    });
  });

  if(results.length === 0){
    resultBox.innerHTML = `<div class="placeholder">找不到「${keyword}」相關文法</div>`;
    return;
  }

  let html = `
    <div class="table-wrap" style="margin-bottom:24px;">
      <table>
        <thead>
          <tr>
            <th>學制</th>
            <th>冊數</th>
            <th>單元</th>
            <th>版本</th>
            <th>文法內容</th>
          </tr>
        </thead>
        <tbody>
  `;

  results.forEach(r => {
    html += `
      <tr>
        <td>${r.level}</td>
        <td>${r.book}</td>
        <td>${r.unit}</td>
        <td>${r.version}</td>
        <td>${r.grammar}</td>
      </tr>
    `;
  });

  html += `</tbody></table></div>`;
  resultBox.innerHTML = html;
}

function handleSearchEnter(event){
  if(event.key === "Enter"){
    searchGrammar();
  }
}
